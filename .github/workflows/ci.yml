name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  # Also run when nothing changed. This test measures a rate limit against a
  # token bucket refilling in real time, which is precisely the shape of test
  # that passes on a fast runner and fails on a slow one. Running it daily
  # finds that before someone else does.
  schedule:
    - cron: "0 5 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate the flake
        run: nix flake check --no-build
      - name: Run the VM test
        run: nix build .#checks.x86_64-linux.antidos -L
